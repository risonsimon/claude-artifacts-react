<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HTML fixture</title>
</head>
<body>
  <h1 id="title">HTML artifact</h1>
  <p id="apis"></p>
  <script>
    localStorage.setItem("html-fixture", "ok");
    document.getElementById("apis").textContent = [
      document.compatMode,
      typeof window.storage,
      typeof window.claude,
      typeof window.fs,
      localStorage.getItem("html-fixture"),
    ].join(",");
    fetch(new URL("https://api.anthropic.com/v1/messages"), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 10, messages: [{ role: "user", content: "hi" }] }),
    }).then((response) => {
      document.getElementById("proxy").textContent = String(response.status);
    });
  </script>
  <p id="proxy"></p>
</body>
</html>
